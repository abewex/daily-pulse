name: Send Pulse to Kindle

# The 7am Claude run pushes a single PDF to a throwaway branch:
#   outbox       -> emails KINDLE_EMAIL
#   outbox-test  -> emails TEST_EMAIL, or GMAIL_USERNAME if unset (use this for any testing; Kindle docs can't be deleted)
# The branch is deleted after every attempt, so PDFs don't pile up and a failure can't block the next run.

on:
  push:
    branches: [outbox, outbox-test]

permissions:
  contents: write

concurrency:
  group: pulse-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Send PDF over SMTP (Gmail or iCloud, picked from the sender address)
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_ADDR: ${{ github.ref_name == 'outbox' && secrets.KINDLE_EMAIL || secrets.TEST_EMAIL || secrets.GMAIL_USERNAME }}
        run: |
          python3 - <<'PY'
          import glob, os, smtplib, ssl, sys
          from email.message import EmailMessage

          def fail(msg):
              # ::error:: shows up as a run annotation, readable via the API without log access.
              print(f"::error title=Pulse send failed::{msg}")
              sys.exit(1)

          for k in ("GMAIL_USERNAME", "GMAIL_APP_PASSWORD", "TO_ADDR"):
              if not os.environ.get(k):
                  fail(f"Missing secret {k} - add it under Settings > Secrets and variables > Actions")

          pdfs = sorted(glob.glob("Abes_Daily_Pulse_*.pdf"))
          if len(pdfs) != 1:
              fail(f"Expected exactly one Abes_Daily_Pulse_*.pdf, found {pdfs}")
          path = pdfs[0]
          data = open(path, "rb").read()
          if not data.startswith(b"%PDF") or len(data) < 10_000:
              fail(f"{path} doesn't look like a valid PDF ({len(data)} bytes)")

          msg = EmailMessage()
          msg["From"] = os.environ["GMAIL_USERNAME"]
          msg["To"] = os.environ["TO_ADDR"]
          # No "convert" in the subject: keeps Kindle from reflowing the fixed layout.
          msg["Subject"] = path.removesuffix(".pdf").replace("_", " ")
          msg.set_content("The Pulse is attached.")
          msg.add_attachment(data, maintype="application", subtype="pdf", filename=os.path.basename(path))

          user = os.environ["GMAIL_USERNAME"].strip()
          pw = "".join(os.environ["GMAIL_APP_PASSWORD"].split())  # drops any whitespace, incl. non-breaking spaces from phone copy/paste
          domain = user.split("@")[-1].lower()
          if domain in ("icloud.com", "me.com", "mac.com"):
              HOST, PORTS = "smtp.mail.me.com", (587,)          # iCloud: STARTTLS on 587 only
          else:
              HOST, PORTS = "smtp.gmail.com", (465, 587)

          def shape(v):
              # Safe diagnostics: never prints the value itself.
              return (f"len={len(v)}, ascii={v.isascii()}, letters_only={v.isalpha()}, dashes={v.count('-')}, lowercase={v == v.lower()}")
          print(f"::notice title=Credential shape::username: len={len(user)} domain={user.split('@')[-1] if '@' in user else 'NO @'} "
                f"ascii={user.isascii()} | app password: {shape(pw)} (Gmail expects len=16 letters; iCloud expects len=19 with 3 dashes) | server={HOST}")

          def send(port):
              phase = "connect"
              try:
                  if port == 465:
                      s = smtplib.SMTP_SSL(HOST, 465, context=ssl.create_default_context(), timeout=60)
                  else:
                      s = smtplib.SMTP(HOST, 587, timeout=60)
                      phase = "starttls"; s.ehlo(); s.starttls(context=ssl.create_default_context())
                  with s:
                      phase = "ehlo"; s.ehlo()
                      phase = "login"
                      import base64
                      trail = []
                      def step(name, cmd):
                          code, resp = s.docmd(cmd)
                          # Gmail's replies only - the commands carry credentials and are never printed.
                          trail.append(f"{name}->{code} {resp.decode(errors='replace')[:80]}")
                          return code
                      try:
                          ok = (step("AUTH LOGIN", "AUTH LOGIN") == 334
                                and step("user", base64.b64encode(user.encode()).decode()) == 334
                                and step("pass", base64.b64encode(pw.encode()).decode()) == 235)
                      finally:
                          print(f"::notice title=SMTP auth trail (port {port})::{' | '.join(trail) or 'no reply'}")
                      if not ok:
                          raise smtplib.SMTPAuthenticationError(535, trail[-1] if trail else "no reply")
                      phase = "send"; s.send_message(msg)
                  return None
              except smtplib.SMTPAuthenticationError as e:
                  fail(f"{HOST} rejected the login ({e.smtp_code}). Check GMAIL_USERNAME is the full sender address and GMAIL_APP_PASSWORD is a current app(-specific) password.")
              except Exception as e:
                  return f"port {port}, during {phase}: {type(e).__name__}: {e}"

          errors = []
          for port in PORTS:
              err = send(port)
              if err is None:
                  break
              errors.append(err)
              print(f"::warning title=SMTP attempt failed::{err}")
          else:
              fail(" | ".join(errors))
          print(f"::notice title=Pulse sent::{path} to {os.environ['GITHUB_REF_NAME']}")
          print(f"Sent {path} ({len(data):,} bytes) on {os.environ['GITHUB_REF_NAME']}")
          PY

      # Always clear the branch so a failed send can't block the next morning's run.
      # The scheduled run also hands Abe the PDF directly, so nothing is lost on failure.
      - name: Delete the outbox branch
        if: always()
        run: git push origin --delete "${GITHUB_REF_NAME}"
