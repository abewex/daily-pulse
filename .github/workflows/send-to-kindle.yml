name: Send Pulse to Kindle

# The 7am Claude run pushes a single PDF to a throwaway branch:
#   outbox       -> emails KINDLE_EMAIL
#   outbox-test  -> emails TEST_EMAIL (use this for any testing; Kindle docs can't be deleted)
# After a successful send the branch is deleted, so PDFs don't pile up in the repo.

on:
  push:
    branches: [outbox, outbox-test]

permissions:
  contents: write

concurrency:
  group: pulse-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Send PDF over Gmail SMTP
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_ADDR: ${{ github.ref_name == 'outbox' && secrets.KINDLE_EMAIL || secrets.TEST_EMAIL }}
        run: |
          python3 - <<'PY'
          import glob, os, smtplib, ssl, sys
          from email.message import EmailMessage

          def fail(msg):
              # ::error:: shows up as a run annotation, readable via the API without log access.
              print(f"::error title=Pulse send failed::{msg}")
              sys.exit(1)

          for k in ("GMAIL_USERNAME", "GMAIL_APP_PASSWORD", "TO_ADDR"):
              if not os.environ.get(k):
                  fail(f"Missing secret {k} - add it under Settings > Secrets and variables > Actions")

          pdfs = sorted(glob.glob("Abes_Daily_Pulse_*.pdf"))
          if len(pdfs) != 1:
              fail(f"Expected exactly one Abes_Daily_Pulse_*.pdf, found {pdfs}")
          path = pdfs[0]
          data = open(path, "rb").read()
          if not data.startswith(b"%PDF") or len(data) < 10_000:
              fail(f"{path} doesn't look like a valid PDF ({len(data)} bytes)")

          msg = EmailMessage()
          msg["From"] = os.environ["GMAIL_USERNAME"]
          msg["To"] = os.environ["TO_ADDR"]
          # No "convert" in the subject: keeps Kindle from reflowing the fixed layout.
          msg["Subject"] = path.removesuffix(".pdf").replace("_", " ")
          msg.set_content("The Pulse is attached.")
          msg.add_attachment(data, maintype="application", subtype="pdf", filename=os.path.basename(path))

          try:
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as s:
                  s.login(os.environ["GMAIL_USERNAME"], os.environ["GMAIL_APP_PASSWORD"].replace(" ", ""))
                  s.send_message(msg)
          except smtplib.SMTPAuthenticationError as e:
              fail(f"Gmail rejected the login ({e.smtp_code}). Check GMAIL_USERNAME is the full address and GMAIL_APP_PASSWORD is a current app password.")
          except Exception as e:
              fail(f"{type(e).__name__}: {e}")
          print(f"::notice title=Pulse sent::{path} to {os.environ['GITHUB_REF_NAME']}")
          print(f"Sent {path} ({len(data):,} bytes) on {os.environ['GITHUB_REF_NAME']}")
          PY

      - name: Delete the outbox branch
        if: success()
        run: git push origin --delete "${GITHUB_REF_NAME}"
